<div class="h-full bg-[#1F0E1C] rounded-[1.563rem] w-[30rem] flex flex-col px-[2.25rem] py-[2.25rem] gap-6">
  
  <span class="font-climate-crisis text-[1.5rem] text-[#FFE6DB] pb-6">Settings</span>

    <button class="flex flex-row items-center justify-between cursor-pointer"
    (click)="openProfile.emit()">
    <span class="font-raleway text-[1rem] font-bold text-[#FFE6DB]">PROFILE</span>
    <lucide-icon [img]="chevronRight" class="text-[#FFE6DB]"></lucide-icon>
    </button>

  <button class="flex flex-row items-center justify-between cursor-pointer"
    (click)="openActivityStats.emit()">
    <span class="font-raleway text-[1rem] font-bold text-[#FFE6DB]">MY ACTIVITY</span>
    <lucide-icon [img]="chevronRight" class="text-[#FFE6DB]"></lucide-icon>
  </button>

  <div class="flex flex-col gap-1">
    <div class="flex flex-row items-center justify-between">
      <span class="font-raleway text-[1rem] font-medium text-[#FFE6DB]/50">Allow notifications</span>
      <button type="button" [class]="preferences.allowNotifications() ? 'bg-[#FF5500]' : 'bg-slate-600'" class="flex w-10 h-6 p-1 rounded-full overflow-hidden outline-none cursor-pointer disabled:cursor-not-allowed disabled:opacity-50" [disabled]="isTogglingNotifications" (click)="onToggleNotifications()">
        <span [class]="preferences.allowNotifications() ? 'translate-x-4' : 'translate-x-0'" class="w-4 h-4 rounded-full bg-white transition-transform duration-300"></span>
      </button>
    </div>
    @if (preferences.notificationPermission() === 'denied') {
      <p class="font-raleway text-xs text-[#FFE6DB]/40">Notifications are blocked in your browser settings.</p>
    }
    @if (preferences.notificationPermission() === 'unsupported') {
      <p class="font-raleway text-xs text-[#FFE6DB]/40">Notifications aren't supported in this browser.</p>
    }
  </div>

  <div class="flex flex-row items-center justify-between">
    <span class="font-raleway text-[1rem] font-medium text-[#FFE6DB]/50">Share your online status</span>
    <button type="button" [class]="preferences.shareOnlineStatus() ? 'bg-[#FF5500]' : 'bg-slate-600'" class="flex w-10 h-6 p-1 rounded-full overflow-hidden outline-none cursor-pointer" (click)="onToggleShareStatus()">
      <span [class]="preferences.shareOnlineStatus() ? 'translate-x-4' : 'translate-x-0'" class="w-4 h-4 rounded-full bg-white transition-transform duration-300"></span>
    </button>
  </div>

  <button class="flex flex-row items-center justify-between cursor-pointer"
    (click)="openArtistForm.emit()">
    <span class="font-raleway text-[1rem] font-bold text-[#FFE6DB]">BECOME AN ARTIST</span>
    <lucide-icon [img]="chevronRight" class="text-[#FFE6DB]"></lucide-icon>
  </button>

</div>
