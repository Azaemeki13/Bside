<div class="relative w-full sm:w-[clamp(9rem,22vw,25rem)]">
  <div class="flex min-w-0 items-center gap-3 overflow-hidden rounded-full border-2 border-[#FFE6DB] bg-transparent px-4 py-3">
    <lucide-icon [img]="search" class="h-5 w-5 shrink-0 text-[#FFE6DB]/70"></lucide-icon>
    <input
      type="text"
      minlength="2"
      maxlength="100"
      aria-label="Search music and playlists"
      placeholder="Search an artist, a song or an album"
      class="font-raleway min-w-0 flex-1 bg-transparent text-sm font-bold text-[#FFE6DB] placeholder:text-[#FFE6DB]/50 focus:outline-none"
      [value]="query"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="closeSoon()" />
  </div>

  @if (isOpen) {
    <div class="absolute left-0 right-0 top-[calc(100%+0.5rem)] z-50 max-h-96 overflow-y-auto rounded-[1.25rem] bg-[#431E3A] py-2">
      <div class="grid grid-cols-2 gap-2 border-b border-[#FFE6DB]/10 px-3 pb-2">
        <label class="flex flex-col gap-1 font-raleway text-[0.65rem] font-bold uppercase text-[#FFE6DB]/50">
          Type
          <select [value]="entityType" (change)="updateEntityType($event)" class="rounded-lg bg-[#1F0E1C] px-2 py-1.5 text-xs normal-case text-[#FFE6DB]">
            <option value="all">Everything</option>
            <option value="song">Songs</option>
            <option value="album">Albums</option>
            <option value="artist">Artists</option>
            <option value="playlist">Playlists</option>
          </select>
        </label>
        <label class="flex flex-col gap-1 font-raleway text-[0.65rem] font-bold uppercase text-[#FFE6DB]/50">
          Sort
          <select [value]="sort" (change)="updateSort($event)" class="rounded-lg bg-[#1F0E1C] px-2 py-1.5 text-xs normal-case text-[#FFE6DB]">
            <option value="relevance">Relevance</option>
            <option value="name_asc">Name A–Z</option>
            <option value="name_desc">Name Z–A</option>
          </select>
        </label>
      </div>
      @if (isSearching) {
        <p class="px-4 py-3 font-raleway text-sm text-[#FFE6DB]/60">Searching...</p>
      } @else if (error) {
        <p class="px-4 py-3 font-raleway text-sm text-red-300">{{ error }}</p>
      } @else if (results.length === 0) {
        <p class="px-4 py-3 font-raleway text-sm text-[#FFE6DB]/60">No results</p>
      } @else {
        @for (result of results; track result.type + result.data.id) {
          <button
            type="button"
            class="flex w-full appearance-none flex-col gap-1 border-0 bg-transparent px-4 py-3 text-left hover:bg-[#FFE6DB]/5 disabled:cursor-default disabled:opacity-60"
            [disabled]="!canOpen(result)"
            (pointerdown)="selectResult($event, result)">
            <span class="w-full truncate font-raleway text-sm font-bold text-[#FFE6DB]">{{ resultTitle(result) }}</span>
            <span class="w-full truncate font-raleway text-xs text-[#FFE6DB]/60">{{ resultMeta(result) }}</span>
          </button>
        }
        @if (totalPages > 1) {
          <div class="flex items-center justify-between border-t border-[#FFE6DB]/10 px-4 pt-2">
            <button type="button" [disabled]="page <= 1" (pointerdown)="$event.preventDefault(); changePage(-1)" class="rounded px-2 py-1 text-xs text-[#FFE6DB] disabled:opacity-30">Previous</button>
            <span class="font-raleway text-[0.65rem] text-[#FFE6DB]/55">{{ page }} / {{ totalPages }} · {{ total }} results</span>
            <button type="button" [disabled]="page >= totalPages" (pointerdown)="$event.preventDefault(); changePage(1)" class="rounded px-2 py-1 text-xs text-[#FFE6DB] disabled:opacity-30">Next</button>
          </div>
        }
      }
    </div>
  }
</div>
