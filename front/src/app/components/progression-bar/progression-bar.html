<div class="w-full rounded-full border border-[#FFE6DB]/15 bg-[#FFE6DB]/10 pl-2 pr-3 py-2 backdrop-blur-sm glass-card sm:pr-6">
	<div class="grid w-full min-w-0 grid-cols-[minmax(0,1fr)_auto] items-center gap-x-3 gap-y-1 sm:grid-cols-[minmax(3.5rem,13rem)_minmax(7rem,8rem)_minmax(3rem,1fr)] sm:gap-6">
  		<div class="flex min-w-0 items-center gap-3">
  			<button type="button" aria-label="Album cover" class="shrink-0 w-[3rem] h-[3rem] rounded-full overflow-hidden cursor-pointer">
  				@if (audio.currentTrack(); as track) {
  					<img [src]="track.coverUrl || 'assets/cover1.png'" alt="" class="w-full h-full object-cover" />
  				} @else {
  					<div class="flex h-full w-full items-center justify-center bg-[#FFE6DB]/10">
  						<lucide-icon [img]="musicIcon" class="h-5 w-5 text-[#FFE6DB]/60 stroke-[1.75]"></lucide-icon>
  					</div>
  				}
  			</button>
  			<div class="flex min-w-0 flex-col justify-center">
  				@if (audio.currentTrack(); as track) {
  					<div #titleViewport class="min-w-0 overflow-hidden whitespace-nowrap">
              <span
                #titleText
                class="inline-block font-Raleway text-sm font-semibold text-[#FFE6DB] will-change-transform"
                [style.transform]="'translateX(-' + titleOffset() + 'px)'"
              >{{ track.title }}</span>
            </div>
  					<div #artistViewport class="min-w-0 overflow-hidden whitespace-nowrap">
              @if (track.artistId) {
                <a
                  #artistText
                  class="inline-block font-Raleway text-xs font-normal text-[#FFE6DB] underline-offset-2 will-change-transform hover:underline"
                  [routerLink]="['/bside_app/artist', track.artistId]"
                  [style.transform]="'translateX(-' + artistOffset() + 'px)'"
                >{{ track.artist }}</a>
              } @else {
                <span
                  #artistText
                  class="inline-block font-Raleway text-xs font-normal text-[#FFE6DB] will-change-transform"
                  [style.transform]="'translateX(-' + artistOffset() + 'px)'"
                >{{ track.artist }}</span>
              }
            </div>
  				} @else {
  					<p class="font-Raleway text-sm font-semibold text-[#FFE6DB] truncate">No track</p>
  				}
  			</div>
  		</div>
		<div class="flex items-center justify-center gap-3 sm:gap-4">
			<button type="button" aria-label="Track back" class="inline-flex h-8 w-8 cursor-pointer items-center justify-center text-[#FFE6DB]" (click)="previousTrack()">
				<lucide-icon [img]="skipBackIcon" class="w-[1.25rem] h-[1.25rem]"></lucide-icon>
			</button>
  			<button type="button" [attr.aria-label]="audio.isPlaying() ? 'Pause' : 'Play'" (click)="togglePlay()" class="text-[#FFE6DB] cursor-pointer rounded-full bg-[#FF5500] p-2">
  				<lucide-icon [img]="audio.isPlaying() ? pause : play" class="w-[1.75rem] h-[1.75rem] fill-current"></lucide-icon>
  			</button>
			<button type="button" aria-label="Track next" class="inline-flex h-8 w-8 cursor-pointer items-center justify-center text-[#FFE6DB]" (click)="nextTrack()">
				<lucide-icon [img]="skipForwardIcon" class="w-[1.25rem] h-[1.25rem]"></lucide-icon>
			</button>
		</div>
		<div class="group relative col-span-2 mx-2 flex h-4 min-w-12 flex-1 items-center sm:col-span-1 sm:mx-0 sm:h-6">
			<div class="absolute inset-x-0 top-1/2 h-[3px] -translate-y-1/2 rounded-full bg-[#FFE6DB]"></div>
  			<div
  				class="absolute left-0 top-1/2 -translate-y-1/2 h-1 rounded-full bg-[#FF5500] pointer-events-none"
  				[style.width.%]="audio.progressPercent()"
  			></div>
  			<input
  				type="range"
  				min="0" max="100" step="1"
  				[value]="audio.progressPercent()"
  				(input)="onInput($event)"
  				aria-label="Progress"
				class="absolute inset-x-0 h-6 w-full cursor-pointer opacity-0"
  			/>
  		</div>
  	</div>
  	@if (audio.error()) {
  		<p class="mt-2 px-4 text-xs text-[#FFE6DB]/80">{{ audio.error() }}</p>
  	}
</div>
