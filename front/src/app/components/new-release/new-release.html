<div class="relative flex h-full w-full items-end overflow-hidden rounded-[1.5rem]">
  <img src="assets/new-bg.png" alt="New release cover" class="h-full w-full object-cover" />

  <div class="absolute left-0 top-0 z-10 flex max-w-[48%] flex-col items-start gap-3 p-4 sm:max-w-[45%] sm:p-6">
    <p class="font-climate-crisis text-[1.5rem] leading-[0.9] text-[#FFE6DB] sm:text-[2rem]">
      NEW<br />RELEASE
    </p>

    <div class="font-raleway text-[#FFE6DB]">
      <p class="text-sm font-semibold text-[#FFE6DB]/80 sm:text-base">{{ song()?.artist_name || 'Latest artist' }}'s latest</p>
      <p class="break-words text-lg font-black leading-tight sm:text-xl">{{ song()?.title || 'Loading latest release...' }}</p>
    </div>

    <button type="button" (click)="play()" [disabled]="!song()"
            class="mt-1 rounded-full border border-[#FFE6DB] px-5 py-2 font-raleway text-sm font-semibold text-[#FFE6DB] cursor-pointer hover:bg-[#FFE6DB]/10 disabled:cursor-not-allowed disabled:opacity-50 duration-300">
      Play now
    </button>
  </div>
</div>
