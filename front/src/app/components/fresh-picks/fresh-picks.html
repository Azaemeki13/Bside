<div class="flex flex-col gap-6">
  <div class="flex flex-nowrap gap-3 overflow-x-auto pb-4">
    @if (isLoading()) {
      @for (slot of skeletonSlots; track $index) {
        <div class="relative flex-shrink-0 w-40 h-40 rounded-2xl overflow-hidden
                    bg-[#FFE6DB]/5 border border-[#FFE6DB]/10 border-2 animate-pulse"></div>
      }
    } @else if (error()) {
      <p class="font-raleway text-sm text-red-300">{{ error() }}</p>
    } @else if (albums().length === 0) {
      <p class="font-raleway text-sm text-[#FFE6DB]/50">No picks yet for this mood.</p>
    } @else {
      @for (album of albums(); track album.id) {
        <a [routerLink]="['/bside_app/album', album.id]"
           class="group relative flex-shrink-0 w-40 h-40 rounded-2xl overflow-hidden
                  bg-[#FFE6DB]/5 border border-[#FFE6DB]/10 cursor-pointer hover:border-[#FF5500] border-2 duration-300">
          <img [src]="album.cover_url" [alt]="album.title" class="h-full w-full object-cover" />
          <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/85 via-black/40 to-transparent p-2 pt-8">
            <p class="truncate font-raleway text-xs font-bold text-[#FFE6DB]">{{ album.title }}</p>
            <p class="truncate font-raleway text-[0.65rem] text-[#FFE6DB]/70">{{ album.artist_name }}</p>
          </div>
        </a>
      }
    }
  </div>
</div>
