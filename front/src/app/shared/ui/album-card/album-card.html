<div class="relative flex flex-col items-center group">
  <div class="z-10 h-[15rem] w-[15rem] overflow-hidden rounded-[1.75rem] transition-transform duration-300 sm:h-[24rem] sm:w-[24rem] sm:rounded-[3rem] sm:group-hover:scale-110">
    <img [src]="cover()" alt="Album cover" class="w-full h-full object-cover">
  </div>

  <div class="pointer-events-none z-[-1] hidden absolute top-full left-1/2 h-[15rem] w-[15rem] -translate-x-1/2 -translate-y-1/2 opacity-0 transition-all duration-300 sm:block sm:h-[24rem] sm:w-[24rem] sm:group-hover:-translate-y-[25%] sm:group-hover:opacity-100">
    <img src="/assets/vinyl.png" alt="Vinyl" class="absolute inset-0 w-full h-full">

    <div class="absolute inset-0 flex items-center justify-center pointer-events-none [animation:spin_10s_linear_infinite]">
      @if (label()) {
        <img [src]="label()" alt="Center label" class="w-1/4 aspect-square object-contain">
      }
    </div>
  </div>
</div>
