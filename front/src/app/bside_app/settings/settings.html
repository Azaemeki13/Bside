@if (responsiveLayout.isCompact()) {
  @if (isDetailRoute) {
    <div class="flex h-full min-h-0 w-full flex-col gap-3 overflow-hidden">
      <button type="button" (click)="backToSettings()" class="flex w-fit shrink-0 cursor-pointer items-center gap-2 rounded-full border border-[#FFE6DB]/30 px-3 py-2 font-raleway text-sm font-bold text-[#FFE6DB]" aria-label="Back to settings">
        <lucide-icon [img]="arrowLeft" class="h-4 w-4"></lucide-icon>
        Back to settings
      </button>
      <div class="min-h-0 min-w-0 flex-1 overflow-y-auto rounded-[1.563rem] px-1 pb-3">
        @switch (activeSection) {
          @case ('profile') {
            <app-profile (close)="closeProfile()" class="block min-w-0"></app-profile>
          }
          @case ('activity') {
            <app-activity-stats (close)="backToSettings()" class="block min-w-0"></app-activity-stats>
          }
          @case ('artist') {
            <app-artist-form (close)="backToSettings()" class="block min-w-0"></app-artist-form>
          }
        }
      </div>
    </div>
  } @else {
    <app-settings-side-bar
      class="block h-full min-h-0 overflow-hidden"
      [selectedSection]="activeSection"
      (openArtistForm)="openArtistForm()"
      (openProfile)="openProfile()"
      (openActivityStats)="openActivityStats()">
    </app-settings-side-bar>
  }
} @else {
  <div class="flex h-full min-h-0 w-full gap-4 overflow-hidden">
    <app-settings-side-bar
      class="block h-full min-h-0 overflow-hidden"
      [selectedSection]="activeSection"
      (openArtistForm)="openArtistForm()"
      (openProfile)="openProfile()"
      (openActivityStats)="openActivityStats()">
    </app-settings-side-bar>

    <div class="min-h-0 min-w-0 flex-1 overflow-y-auto pb-3 pr-1">
      @switch (activeSection) {
        @case ('profile') {
          <app-profile (close)="closeProfile()" class="block min-w-0"></app-profile>
        }
        @case ('activity') {
          <app-activity-stats (close)="backToSettings()" class="block min-w-0"></app-activity-stats>
        }
        @case ('artist') {
          <app-artist-form (close)="backToSettings()" class="block min-w-0"></app-artist-form>
        }
      }
    </div>
  </div>
}
