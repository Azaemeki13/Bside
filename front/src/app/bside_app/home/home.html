<div class="flex w-full min-w-0 flex-col gap-8 pb-6">
  <div class="grid w-full min-w-0 grid-cols-1 items-stretch gap-4 md:grid-cols-2 xl:grid-cols-[24fr_40fr_36fr]">
    <app-recent-play class="block h-[28rem] min-w-0 overflow-hidden md:h-[30rem] xl:h-[clamp(28rem,27vw,30rem)]"></app-recent-play>
    <app-top-spins class="block min-h-[22rem] min-w-0 overflow-hidden md:h-[30rem] xl:h-[clamp(28rem,27vw,30rem)]"></app-top-spins>
    <app-new-release class="block h-[22rem] min-w-0 overflow-hidden md:col-span-2 md:h-[28rem] xl:col-span-1 xl:h-[clamp(28rem,27vw,30rem)]"></app-new-release>
  </div>

  <app-daily-mix></app-daily-mix>

  <section class="flex min-w-0 flex-col gap-5">
    <h2 class="font-raleway text-[1.5rem] font-semibold text-[#FFE6DB]/60">Fresh picks, just for you</h2>
    <app-tag-bar (tagSelected)="onMoodSelected($event)" class="block min-w-0"></app-tag-bar>
    <app-fresh-picks [selectedMood]="selectedMood()" class="block min-w-0"></app-fresh-picks>
  </section>
</div>
