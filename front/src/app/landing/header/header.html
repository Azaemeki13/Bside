<header class="bg-[#0C060C]">
  <div class="flex w-full items-center justify-between gap-3 px-4 py-3 sm:flex-row sm:gap-4 sm:px-6 sm:py-4 md:px-8">
    <a routerLink="/" class="cursor-pointer">
      <img class="h-8 w-auto sm:h-10 md:h-12" src="assets/B-SIDE.svg" alt="B-Side logo">
    </a>
    <nav class="flex shrink-0 justify-end gap-2 sm:w-auto sm:gap-4 md:gap-6">
      <nav-button [label]="'Log in'" [link]="'/login'" variant="light-pink" fontSize="text-sm sm:text-[clamp(0.875rem,2.2vw,1.5rem)]" fontStyle="font-medium"></nav-button>
      <nav-button [label]="'Sign up'" [link]="'/signup'" variant="raspberry" fontSize="text-sm sm:text-[clamp(0.875rem,2.2vw,1.5rem)]" fontStyle="font-medium"></nav-button>
    </nav>
  </div>
</header>
