<main class="bg-[#170814] pb-8 sm:pb-14 md:pb-16">
  <div class="relative min-h-[29rem] w-full overflow-hidden rounded-b-[1rem] sm:min-h-[75vh] sm:rounded-[1.5rem] md:min-h-screen md:rounded-[1.875rem]">
  <img class="absolute inset-0 h-full w-full rounded-[1rem] object-cover object-center sm:rounded-[1.5rem] md:rounded-[1.875rem]" src="assets/hero.png" alt="Hero Image">
  <div class="absolute left-4 top-[48%] z-20 w-[88%] -translate-y-1/2 text-left sm:left-6 sm:top-1/2 sm:w-[80%] md:left-8 md:w-auto">
    <div class="flex max-w-[48rem] flex-col gap-4 sm:gap-3">
            <h1 class="max-w-[8ch] text-[2.65rem] leading-[0.98] font-bold font-raleway text-[#FFE6DB] sm:max-w-[8ch] sm:text-[clamp(2.25rem,8vw,5rem)] md:max-w-[6ch]">MUSIC FOR EVERY MOMENT.</h1>
            <h2 class="max-w-[27ch] text-[1.05rem] leading-snug font-normal font-raleway text-[#FFE6DB] sm:max-w-[30ch] sm:text-[clamp(1rem,4vw,2.5rem)] md:leading-none">Stream millions of songs, discover new artists, and build the soundtrack of your life.</h2>
            <nav-button [label]="'Get started'" [link]="'/signup'" variant="raspberry" fontSize="text-sm sm:text-[clamp(0.875rem,2.2vw,1.5rem)]" fontStyle="font-medium"></nav-button>
        </div>
    </div>
  </div>
</main>
